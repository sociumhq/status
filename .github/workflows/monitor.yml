name: monitor

# GitHub runs a `*/5` schedule rarely, so one job checks every 5 minutes for almost six hours and then starts the
# next job itself (workflow_dispatch with GITHUB_TOKEN is allowed to start a run). The hourly schedule only
# restarts the chain if it ever breaks; extra runs wait in the concurrency queue instead of running twice.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Remember when the watch started
        run: echo "WATCH_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check Socium services every 5 minutes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check.py --loop-minutes 340 --interval 300
      - name: Start the next watch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A watch that ended within 30 minutes broke early (bad commit, outage of GitHub): no instant re-dispatch
        # loop, the hourly schedule restarts it instead.
        run: |
          if [ $(( $(date +%s) - WATCH_START )) -ge 1800 ]; then
            gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "The watch ended early; the hourly schedule will start the next one."
          fi
